<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6F69}a:hover{color:#0B5B56}
a:focus-visible,button:focus-visible{outline:2px solid #0F6F69;outline-offset:2px}
input:focus{outline:none;border-color:#0F6F69;box-shadow:0 0 0 3px #E3F2F0}
.pbtn:hover{background:#0B5B56}
.flink{color:#5A6573;text-decoration:none}.flink:hover{color:#12171D;text-decoration:underline}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #F5F6F8; color: #12171D; font-family: 'Public Sans', system-ui, sans-serif">

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 48px 16px">
    <div style="width: 100%; max-width: 420px">
      <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; color: #12171D; text-decoration: none">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #0F6F69; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">H</span>
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">HRMS</span>
      </a>

      <form style="background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 14px; padding: 32px; box-shadow: 0 8px 24px rgba(18,23,29,0.06); display: flex; flex-direction: column; gap: 20px">
        <div>
          <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.02em">Iniciar sesión</h1>
          <p style="margin: 6px 0 0; font-size: 15px; color: #5A6573">Ingresa con tu cuenta institucional.</p>
        </div>

        <sc-if value="{{showError}}">
          <div role="alert" style="padding: 12px 14px; border-radius: 8px; background: #FDECEA; color: #B42318; font-size: 14px">Correo o contraseña incorrectos. Inténtalo de nuevo.</div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="email" style="font-size: 14px; font-weight: 600">Correo electrónico</label>
          <input id="email" type="email" autocomplete="username" placeholder="nombre@empresa.com" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; font: inherit; font-size: 15px; color: #12171D; background: #FFFFFF">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="password" style="font-size: 14px; font-weight: 600">Contraseña</label>
            <a href="#" style="font-size: 14px; font-weight: 500">¿Olvidaste tu contraseña?</a>
          </div>
          <input id="password" type="password" autocomplete="current-password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; font: inherit; font-size: 15px; color: #12171D; background: #FFFFFF">
        </div>

        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; cursor: pointer">
          <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #0F6F69">
          Mantener la sesión iniciada
        </label>

        <button class="pbtn" type="submit" style="height: 48px; border: 0; border-radius: 8px; background: #0F6F69; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Ingresar</button>
      </form>

      <p style="margin: 20px 0 0; text-align: center; font-size: 14px; color: #5A6573">¿No tienes cuenta? Solicítala a tu administrador.</p>
    </div>
  </main>

  <footer style="box-sizing: border-box; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; color: #5A6573">
    <span>© 2026 HRMS · Versión 0.1</span>
    <span style="display: flex; gap: 20px"><a class="flink" href="#">Ayuda</a><a class="flink" href="#">Privacidad</a><a class="flink" href="#">Términos</a></span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { showError: !!this.props.showError };
  }
}
</script>
</body>
</html>
