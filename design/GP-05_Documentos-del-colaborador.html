<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GP-05 · Documentos del colaborador</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.gp{--bg:#F5F6F8;--surface:#FFFFFF;--border:#E2E5EA;--text:#12171D;--muted:#5A6573;--accent:#0F6F69;--onaccent:#FFFFFF;--soft:#E3F2F0;--danger:#B42318;--dangersoft:#FDECEA;--warn:#8A4B00;--warnsoft:#FFF4E0;--info:#1D4E89;--infosoft:#E8F0FA;font-family:'Public Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.45}
.gp *{box-sizing:border-box}
.gp button,.gp input,.gp select,.gp textarea{font:inherit}
.gp h1,.gp h2,.gp h3,.gp p{margin:0}
.gp :focus-visible{outline:3px solid #1D4E89;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #B9C0CA;background:var(--surface);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn-p:hover{background:#0B5A55}
.btn-d{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-d:hover{background:#912016}
.btn-s{min-height:36px;padding:0 12px;font-size:14px}
.btn-l{border-color:transparent;background:transparent;color:var(--accent)}
.inp{width:100%;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #8B95A3;background:#fff;color:var(--text);font-size:15px}
textarea.inp{padding:10px 12px;min-height:88px;resize:vertical}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.lbl{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
.err{margin-top:6px;font-size:13px;color:var(--danger);font-weight:500}
.hint{margin-top:6px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(18,23,29,.05)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-ok{background:#E3F2F0;color:#0B5A55}
.b-off{background:#ECEEF1;color:#3C4654}
.b-warn{background:#FFF4E0;color:#8A4B00}
.b-info{background:#E8F0FA;color:#1D4E89}
.b-err{background:#FDECEA;color:#B42318}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--soft);color:var(--text)}
.nav[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.tab{min-height:44px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle;min-height:64px}
.tbl tbody tr:first-child td{border-top:0}
.tbl tbody tr:hover{background:#FAFBFC}
.seg{display:inline-flex;border:1px solid #B9C0CA;border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:#fff;color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.skel{height:16px;border-radius:6px;background:#E6E9EE;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="gp" style="min-height: 1000px; display: flex; flex-direction: column">
  <a href="#contenido" class="sr">Saltar al contenido</a>

  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border)">
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">H</div>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">HRMS</span>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 8px; background: var(--bg); font-size: 14px; font-weight: 600" aria-label="Organización: Altavista S.A.">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 011-1h8a1 1 0 011 1v16M14 9h5a1 1 0 011 1v11M3 21h18M8 8h2M8 12h2M8 16h2"/></svg>Altavista S.A.
    </span>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{user.ini}}</span>
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 600">{{user.nombre}}</span><span style="font-size: 12px; color: var(--muted)">{{user.rol}}</span></span>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="Principal" style="flex: 1 1 248px; max-width: 100%; padding: 16px 12px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px">
      <!--FOR navItems|n-->
        <button class="nav" aria-current="{{n.cur}}" onClick="{{n.go}}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg>{{n.label}}
        </button>
      <!--/FOR-->
    </nav>

    <main id="contenido" style="flex: 999 1 560px; min-width: 0; padding: 32px 24px">
      <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

        <div role="status" aria-live="polite">
          <!--IF hasToast-->
            <div style="{{toast.style}}">
              <span style="font-weight: 600">{{toast.text}}</span>
              <button class="btn btn-s" onClick="{{closeToast}}">Cerrar aviso</button>
            </div>
          <!--/IF-->
        </div>

        <!-- ===== LISTADO ===== -->
        <!--IF isLista-->
          <div style="display: flex; flex-direction: column; gap: 20px">
            <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <h1 style="font-size: 28px; line-height: 1.2; letter-spacing: -0.02em">Fichas de colaboradores</h1>
                <p style="color: var(--muted)">Consulta y administra los expedientes del personal</p>
              </div>
              <button class="btn btn-p" onClick="{{newFicha}}">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva ficha
              </button>
            </div>

            <div class="card" style="padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
              <div style="flex: 2 1 280px; min-width: 0">
                <label class="lbl" for="q">Buscar</label>
                <input class="inp" id="q" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Buscar por nombre, apellido, puesto o código">
              </div>
              <div style="flex: 1 1 180px; min-width: 0">
                <label class="lbl" for="fe">Estado laboral</label>
                <select class="inp" id="fe" value="{{fEstado}}" onChange="{{setEstado}}">
                  <!--FOR estadoOpts|o--><option value="{{o.v}}">{{o.label}}</option><!--/FOR-->
                </select>
              </div>
              <div style="flex: 1 1 200px; min-width: 0">
                <label class="lbl" for="fu">Unidad organizacional</label>
                <select class="inp" id="fu" value="{{fUnidad}}" onChange="{{setUnidad}}">
                  <!--FOR unidadOpts|o--><option value="{{o.v}}">{{o.label}}</option><!--/FOR-->
                </select>
              </div>
              <button class="btn" onClick="{{clearFilters}}" disabled="{{noFiltros}}">Limpiar filtros</button>
            </div>

            <div class="card" style="overflow: hidden">
              <!--IF isError-->
                <div role="alert" style="padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
                  <span class="badge b-err">Error</span>
                  <h2 style="font-size: 18px">No se pudieron cargar las fichas</h2>
                  <p style="color: var(--muted); max-width: 440px">Ocurrió un problema al consultar la información. Tus filtros se conservan.</p>
                  <button class="btn btn-p" onClick="{{retryLista}}">Reintentar</button>
                </div>
              <!--/IF-->
              <!--IF isLoading-->
                <div aria-busy="true" style="padding: 8px 16px">
                  <p class="sr">Cargando fichas…</p>
                  <!--FOR skelRows|k-->
                    <div style="display: flex; gap: 24px; padding: 20px 0; border-top: 1px solid var(--border)">
                      <div class="skel" style="width: 72px"></div><div class="skel" style="flex: 2"></div><div class="skel" style="flex: 1"></div><div class="skel" style="flex: 1"></div><div class="skel" style="width: 96px"></div>
                    </div>
                  <!--/FOR-->
                </div>
              <!--/IF-->
              <!--IF isEmptyAll-->
                <div style="padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
                  <h2 style="font-size: 18px">Aún no hay fichas de colaboradores</h2>
                  <p style="color: var(--muted); max-width: 440px">Crea la primera ficha para comenzar a registrar expedientes. Una ficha puede existir sin cuenta ni vínculo laboral.</p>
                  <button class="btn btn-p" onClick="{{newFicha}}">Nueva ficha</button>
                </div>
              <!--/IF-->
              <!--IF noMatch-->
                <div style="padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
                  <h2 style="font-size: 18px">Ningún colaborador coincide con la búsqueda</h2>
                  <p style="color: var(--muted)">Prueba con otros términos o quita algún filtro.</p>
                  <button class="btn" onClick="{{clearFilters}}">Limpiar filtros</button>
                </div>
              <!--/IF-->
              <!--IF hasRows-->
                <div style="overflow-x: auto" tabindex="0" role="region" aria-label="Tabla de fichas, desplazable horizontalmente">
                  <table class="tbl" style="min-width: 860px">
                    <caption class="sr">Fichas de colaboradores ordenadas por apellidos, nombres y código</caption>
                    <thead><tr>
                      <th scope="col">Código</th><th scope="col">Colaborador</th><th scope="col">Puesto</th><th scope="col">Unidad organizacional</th><th scope="col">Estado</th><th scope="col"><span class="sr">Acciones</span></th>
                    </tr></thead>
                    <tbody>
                      <!--FOR rows|r-->
                        <tr style="height: 64px">
                          <td style="color: var(--muted); font-variant-numeric: tabular-nums">{{r.codigo}}</td>
                          <td><div style="font-weight: 600">{{r.nombre}}</div><div style="font-size: 13px; color: var(--muted)">{{r.correo}}</div></td>
                          <td style="{{r.puestoStyle}}">{{r.puesto}}</td>
                          <td style="{{r.unidadStyle}}">{{r.unidad}}</td>
                          <td><span class="{{r.badgeCls}}">{{r.estado}}</span></td>
                          <td style="text-align: right"><button class="btn btn-s" onClick="{{r.open}}" aria-label="{{r.aria}}">Ver ficha</button></td>
                        </tr>
                      <!--/FOR-->
                    </tbody>
                  </table>
                </div>
                <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border)">
                  <span role="status" style="font-size: 14px; color: var(--muted)">{{rango}}</span>
                  <div style="display: flex; align-items: center; gap: 8px">
                    <button class="btn btn-s" onClick="{{prev}}" disabled="{{noPrev}}">Anterior</button>
                    <span style="font-size: 14px; padding: 0 8px">{{pageLabel}}</span>
                    <button class="btn btn-s" onClick="{{next}}" disabled="{{noNext}}">Siguiente</button>
                  </div>
                </div>
              <!--/IF-->
            </div>
          </div>
        <!--/IF-->

        <!-- ===== DETALLE (admin, Mi ficha, Mis documentos) ===== -->
        <!--IF isDetalle-->
          <div style="display: flex; flex-direction: column; gap: 20px">
            <div style="display: flex; flex-direction: column; gap: 16px">
              <!--IF det.canBack-->
                <div><button class="btn btn-l btn-s" onClick="{{det.back}}" style="padding-left: 0">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Volver a fichas de colaboradores
                </button></div>
              <!--/IF-->
              <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px">
                <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                  <p style="font-size: 13px; font-weight: 600; color: var(--muted)">{{det.eyebrow}}</p>
                  <h1 style="font-size: 28px; line-height: 1.2; letter-spacing: -0.02em">{{det.title}}</h1>
                  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
                    <span style="font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums">{{det.codigo}}</span>
                    <span class="{{det.badgeCls}}">{{det.estado}}</span>
                    <!--IF det.hasProg-->
                      <span class="badge b-info">{{det.progTxt}}</span>
                    <!--/IF-->
                  </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <!--IF det.canEdit--><button class="btn" onClick="{{det.edit}}">Editar datos</button><!--/IF-->
                  <!--IF det.canIngreso--><button class="btn" onClick="{{det.ingreso}}">Registrar ingreso</button><!--/IF-->
                  <!--IF det.canExport-->
                    <button class="btn btn-p" onClick="{{det.doExport}}" disabled="{{det.exportBusy}}" aria-busy="{{det.exportBusy}}">
                      <!--IF det.exportBusy--><span class="spin" aria-hidden="true"></span><!--/IF-->{{det.exportLabel}}
                    </button>
                  <!--/IF-->
                </div>
              </div>
              <!--IF exb.show-->
                <div role="status" style="{{exb.style}}">
                  <span>{{exb.text}}</span>
                  <!--IF exb.hasAction--><button class="btn btn-s" onClick="{{exb.act}}">{{exb.actionLabel}}</button><!--/IF-->
                </div>
              <!--/IF-->
            </div>

            <!--IF det.showTabs-->
              <div role="tablist" aria-label="Secciones de la ficha" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border)">
                <!--FOR tabs|t-->
                  <button class="tab" role="tab" aria-selected="{{t.sel}}" onClick="{{t.go}}">{{t.label}}</button>
                <!--/FOR-->
              </div>
            <!--/IF-->

            <!-- Personal y puesto -->
            <!--IF tabPersonal-->
              <div role="tabpanel" aria-label="Personal y puesto" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start">
                <!--FOR cards|c-->
                  <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
                    <div><h2 style="font-size: 16px">{{c.title}}</h2><!--IF c.hasSub--><p style="font-size: 13px; color: var(--muted); margin-top: 2px">{{c.sub}}</p><!--/IF--></div>
                    <!--IF c.hasProg-->
                      <p style="padding: 10px 12px; border-radius: 8px; background: var(--infosoft); color: var(--info); font-size: 14px; font-weight: 500">{{c.prog}}</p>
                    <!--/IF-->
                    <!--IF c.dep-->
                      <div role="alert" style="padding: 12px; border-radius: 8px; background: var(--warnsoft); color: var(--warn); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
                        <span style="font-weight: 600">Información no disponible</span>
                        <button class="btn btn-s" onClick="{{retryDep}}">Reintentar</button>
                      </div>
                    <!--/IF-->
                    <!--IF c.ok-->
                      <dl style="margin: 0; display: grid; grid-template-columns: minmax(110px, 38%) minmax(0, 1fr); gap: 12px 16px">
                        <!--FOR c.rows|r-->
                          <div style="display: contents">
                            <dt style="font-size: 14px; color: var(--muted)">{{r.k}}</dt>
                            <dd style="margin: 0; font-size: 15px; overflow-wrap: anywhere"><span style="{{r.vStyle}}">{{r.v}}</span><!--IF r.hasBadge--> <span class="{{r.badgeCls}}">{{r.badge}}</span><!--/IF--></dd>
                          </div>
                        <!--/FOR-->
                      </dl>
                    <!--/IF-->
                  </section>
                <!--/FOR-->
              </div>
            <!--/IF-->

            <!-- Desarrollo -->
            <!--IF tabDes-->
              <div role="tabpanel" aria-label="Desarrollo" style="display: flex; flex-direction: column; gap: 20px">
                <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
                    <h2 style="font-size: 16px">Formación académica</h2>
                    <!--IF des.canEdit--><button class="btn btn-s" onClick="{{des.addFor}}">Agregar formación</button><!--/IF-->
                  </div>
                  <!--IF des.noFor--><p style="color: var(--muted)">Aún no hay formación académica registrada.</p><!--/IF-->
                  <!--FOR des.formaciones|x-->
                    <article style="border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
                      <div style="min-width: 0; flex: 1 1 300px">
                        <h3 style="font-size: 15px; font-weight: 600">{{x.titulo}}</h3>
                        <p style="font-size: 14px; color: var(--muted)">{{x.nivel}} · {{x.institucion}}</p>
                        <p style="font-size: 14px; margin-top: 4px">{{x.fechas}}</p>
                        <p style="font-size: 14px; color: var(--muted); margin-top: 4px">{{x.obs}}</p>
                      </div>
                      <div style="display: flex; align-items: flex-start; gap: 8px"><span class="{{x.badgeCls}}">{{x.estado}}</span><!--IF x.canEdit--><button class="btn btn-s" onClick="{{x.edit}}" aria-label="{{x.aria}}">Editar</button><!--/IF--></div>
                    </article>
                  <!--/FOR-->
                </section>

                <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
                    <h2 style="font-size: 16px">Experiencia anterior</h2>
                    <!--IF des.canEdit--><button class="btn btn-s" onClick="{{des.addExp}}">Agregar experiencia</button><!--/IF-->
                  </div>
                  <!--IF des.noExp--><p style="color: var(--muted)">Aún no hay experiencia anterior registrada.</p><!--/IF-->
                  <!--FOR des.experiencias|x-->
                    <article style="border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
                      <div style="min-width: 0; flex: 1 1 300px">
                        <h3 style="font-size: 15px; font-weight: 600">{{x.cargo}}</h3>
                        <p style="font-size: 14px; color: var(--muted)">{{x.org}}</p>
                        <p style="font-size: 14px; margin-top: 4px">{{x.fechas}}</p>
                        <p style="font-size: 14px; margin-top: 4px"><span style="color: var(--muted)">Funciones: </span>{{x.funciones}}</p>
                        <p style="font-size: 14px; margin-top: 2px"><span style="color: var(--muted)">Observaciones: </span>{{x.obs}}</p>
                      </div>
                      <!--IF x.canEdit--><div><button class="btn btn-s" onClick="{{x.edit}}" aria-label="{{x.aria}}">Editar</button></div><!--/IF-->
                    </article>
                  <!--/FOR-->
                </section>

                <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
                    <h2 style="font-size: 16px">Disponibilidad para movilidad</h2>
                    <!--IF des.canEdit--><button class="btn btn-s" onClick="{{des.editMov}}">Actualizar disponibilidad</button><!--/IF-->
                  </div>
                  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span class="{{des.movCls}}">{{des.movEstado}}</span><span style="font-size: 14px; color: var(--muted)">{{des.movFecha}}</span></div>
                  <p style="font-size: 14px">{{des.movObs}}</p>
                  <p style="font-size: 13px; color: var(--muted)">Estar disponible no significa que exista un traslado aprobado.</p>
                </section>

                <section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
                  <div><h2 style="font-size: 16px">Trayectoria interna</h2><p style="font-size: 13px; color: var(--muted); margin-top: 2px">Hechos laborales registrados en la organización. Es independiente de la experiencia anterior.</p></div>
                  <!--IF des.trayDep-->
                    <div role="alert" style="padding: 12px; border-radius: 8px; background: var(--warnsoft); color: var(--warn); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
                      <span style="font-weight: 600">Información no disponible</span>
                      <button class="btn btn-s" onClick="{{retryDep}}">Reintentar</button>
                    </div>

<script>
(function(){
  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
  var NS='http://www.w3.org/1999/xhtml';
  var holder=document.createElement('template');
  holder.innerHTML=document.getElementById('tpl').textContent;
  var ROOT=Array.prototype.slice.call(holder.content.childNodes);
  function look(path,scope){
    path=path.trim();
    if(path==='true')return true; if(path==='false')return false;
    var p=path.split('.'),v=scope[p[0]];
    for(var i=1;i<p.length;i++){v=v==null?undefined:v[p[i]];}
    return v;
  }
  function evalAttr(raw,scope){
    var m=raw.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
    if(m)return look(m[1],scope);
    if(raw.indexOf('{{')<0)return raw;
    return raw.replace(HOLE,function(_,p){var v=look(p,scope);return v==null?'':String(v);});
  }
  var TEXTY=['','text','search','number','date','email','tel'];
  function renderEl(n,scope){
    var el=n.namespaceURI===NS?document.createElement(n.localName):document.createElementNS(n.namespaceURI,n.localName);
    var tv=n.hasAttribute('type')?String(evalAttr(n.getAttribute('type'),scope)||''):'';
    var hasValue=false,pending,checked,hasChecked=false;
    Array.prototype.forEach.call(n.attributes,function(a){
      var name=a.name,raw=a.value;
      if(name.indexOf('hint-')===0)return;
      if(name==='onclick'||name==='onchange'||name==='onsubmit'){
        var fn=evalAttr(raw,scope);
        if(typeof fn==='function'){
          var ev=name.slice(2);
          if(ev==='change'&&((el.localName==='input'&&TEXTY.indexOf(tv)>=0)||el.localName==='textarea'))ev='input';
          el.addEventListener(ev,fn);
        }
        return;
      }
      var v=evalAttr(raw,scope);
      if(name==='value'&&el.localName!=='option'){hasValue=true;pending=v==null?'':String(v);return;}
      if(name==='checked'){hasChecked=true;checked=!!v;return;}
      if(name==='disabled'){if(v)el.setAttribute('disabled','');return;}
      if(name.indexOf('aria-')===0){if(v==null)return;el.setAttribute(name,String(v));return;}
      if(v===false||v==null)return;
      if(v===true){el.setAttribute(name,'');return;}
      el.setAttribute(name,String(v));
    });
    renderList(Array.prototype.slice.call(n.childNodes),scope,el);
    if(hasValue){try{el.value=pending;}catch(e){}}
    if(hasChecked)el.checked=checked;
    return el;
  }
  function renderList(nodes,scope,out){
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      if(n.nodeType===8){
        var d=n.data;
        if(d.indexOf('IF ')===0||d.indexOf('FOR ')===0){
          var depth=1,j=i+1;
          for(;j<nodes.length;j++){

  buildDlg(d) {

        F('codigo', 'Código', { kind: 'read', value: edit ? ficha.id : 'El código se asignará al guardar' }),
        F('tipoId', 'Tipo de identificación', { kind: 'select', req: true, opts: [['Cédula', 'Cédula'], ['Pasaporte', 'Pasaporte'], ['Otro', 'Otro']] }),
        F('numId', 'Número de identificación', { req: true, hint: 'Se conservan los ceros iniciales. Máximo 50 caracteres.' }),
        F('nombres', 'Nombres', { req: true }), F('apellidos', 'Apellidos', { req: true })

      sections.push({ title: '', fields: [F('estado', 'Disponibilidad', { kind: 'radio', opts: [['Disponible', 'Disponible'], ['No disponible', 'No disponible'], ['No informada', 'No informada']], wide: true }), F('obs', 'Observaciones', { kind: 'area', wide: true })] });
      actions = [cancel, primary('Guardar disponibilidad')];
    }
    if (d.kind === 'categoria') {
      narrow = true; title = d.ctx.idx ? 'Editar nombre de la categoría' : 'Nueva categoría'; sub = d.ctx.idx ? '' : 'La categoría nace activa.';
      sections.push({ title: '', fields: [F('nombre', 'Nombre', { req: true, wide: true, hint: 'Máximo 100 caracteres. No se distinguen mayúsculas ni espacios exteriores.' })] });
      actions = [cancel, primary(d.ctx.idx ? 'Guardar nombre' : 'Crear categoría')];
    }
    if (d.kind === 'doc') {
      title = 'Subir documento'; const act = s.cats.filter((c) => c.activa); sub = 'Se agregará a la ficha de ' + (s.fichas.find((f) => f.id === d.ctx.id) || {}).nombres + '. No se puede editar después de cargarlo.';
      if (act.length === 0) { notice = N('warn', 'No hay categorías activas', 'Para subir un documento necesitas al menos una categoría activa.', [{ label: 'Ir a categorías documentales', go: () => this.setState({ dlg: null, screen: 'categorias' }) }]); actions = [cancel]; }
