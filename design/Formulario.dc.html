<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva competencia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
.nav:hover{background:var(--soft);color:var(--text)}
.nav[aria-current]{background:var(--soft);color:var(--accent);font-weight:600}
.nav:focus-visible,.ibtn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.ibtn:hover{background:var(--soft)}
.flink{color:var(--muted);text-decoration:none}.flink:hover{color:var(--text);text-decoration:underline}
.fld{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:15px}
.fld[aria-invalid="true"]{border-color:var(--danger)}
.lbl{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
.err{margin:6px 0 0;font-size:13px;color:var(--danger)}
</style>
</helmet>
<div style="min-height: 1100px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Public Sans', system-ui, sans-serif; {{themeStyle}}">

  <header style="height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border)">
    <div style="display: flex; align-items: center; gap: 12px; width: 200px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center; font-weight: 700">H</div>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">HRMS</span>
    </div>
    <div style="flex: 1"></div>
    <button class="ibtn" aria-label="Cambiar tema">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer" aria-haspopup="menu" aria-expanded="false">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">MR</span>
      <span style="font-size: 14px; font-weight: 600">Marta Ríos</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="Principal" style="flex: 0 0 248px; box-sizing: border-box; padding: 16px 12px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px">
      <a class="nav" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</a>
      <a class="nav" href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>Competencias</a>
      <a class="nav" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.2.6 3.5 2.6 3.5 5"/></svg>Empleados</a>
      <a class="nav" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg>Vacantes</a>
      <a class="nav" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px">
      <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
        <nav aria-label="Ruta de navegación" style="font-size: 14px; color: var(--muted)">
          <a class="flink" href="Competencias.dc.html">Competencias</a> <span aria-hidden="true">/</span> <span style="color: var(--text)">Nueva competencia</span>
        </nav>
        <h1 style="margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em">Nueva competencia</h1>

        <form style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px" novalidate>
          <div role="alert" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--dangersoft); color: var(--danger); font-size: 14px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>
            <span>Revisa los campos marcados antes de guardar.</span>
          </div>

          <div>
            <label class="lbl" for="nombre">Nombre</label>
            <input class="fld" id="nombre" type="text" value="" aria-invalid="true" aria-describedby="nombre-err">
            <p class="err" id="nombre-err">El nombre es obligatorio.</p>
          </div>

          <div>
            <label class="lbl" for="desc">Descripción</label>
            <textarea class="fld" id="desc" rows="3">Colabora con otros para lograr objetivos comunes.</textarea>
            <p style="margin: 6px 0 0; font-size: 13px; color: var(--muted)">Máximo 1000 caracteres.</p>
          </div>

          <div>
            <label class="lbl" for="clas">Clasificación</label>
            <select class="fld" id="clas" style="max-width: 280px">
              <option>Cardinal</option><option>Específica</option>
            </select>
          </div>

          <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px">
            <legend style="padding: 0; margin-bottom: 12px; font-size: 14px; font-weight: 600">Grados de dominio</legend>
            <sc-for list="{{grados}}" as="g" hint-placeholder-count="4">
              <div>
                <label class="lbl" for="{{g.id}}" style="font-weight: 500">Grado {{g.letra}}</label>
                <textarea class="fld" id="{{g.id}}" rows="2"></textarea>
              </div>
            </sc-for>
          </fieldset>

          <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding-top: 4px">
            <a href="Competencias.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 500; font-size: 15px">Cancelar</a>
            <button type="submit" style="height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--onaccent); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer">Guardar competencia</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <footer style="box-sizing: border-box; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--border)">
    <span>© 2026 HRMS · Versión 0.1</span>
    <span style="display: flex; gap: 20px"><a class="flink" href="#">Ayuda</a><a class="flink" href="#">Privacidad</a><a class="flink" href="#">Términos</a></span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const light = { bg: '#F5F6F8', surface: '#FFFFFF', border: '#E2E5EA', text: '#12171D', muted: '#5A6573', accent: '#0F6F69', onaccent: '#FFFFFF', soft: '#E3F2F0', danger: '#B42318', dangersoft: '#FDECEA' };
    const dark = { bg: '#0E1318', surface: '#151B22', border: '#27303A', text: '#E7EBEF', muted: '#9CA7B3', accent: '#4FD1C5', onaccent: '#06201E', soft: '#12302D', danger: '#FF8A80', dangersoft: '#3A1B1A' };
    const t = this.props.dark ? dark : light;
    return {
      themeStyle: Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';'),
      grados: ['A', 'B', 'C', 'D'].map((l) => ({ letra: l, id: 'grado_' + l.toLowerCase() }))
    };
  }
}
</script>
</body>
</html>
